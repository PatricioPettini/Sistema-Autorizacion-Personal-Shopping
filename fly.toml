app = "sistema-autorizacion-personal-shopping"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  STORAGE_PATH = "/data/storage"
  HOST = "0.0.0.0"
  PORT = "8080"
  TZ = "America/Argentina/Buenos_Aires"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1